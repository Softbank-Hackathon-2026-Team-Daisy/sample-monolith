# Generic, vendor-neutral reference manifest for HelloCalc.
# Build and publish the image to a registry your cluster can pull from, then
# set the image reference below (or use `kubectl set image`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellocalc
  labels:
    app.kubernetes.io/name: hellocalc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hellocalc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hellocalc
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hellocalc
          image: hellocalc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: SHUTDOWN_TIMEOUT
              value: 20s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hellocalc
  labels:
    app.kubernetes.io/name: hellocalc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hellocalc
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
